apiVersion: batch/v1
kind: Job
metadata:
  name: db-schema
  namespace: journal
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
      containers:
        - name: psql
          image: public.ecr.aws/docker/library/postgres:18-alpine
          command:
            - sh
            - -c
            - psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /schema/database_setup.sql
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: journal-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: schema
              mountPath: /schema
      volumes:
        - name: schema
          configMap:
            name: db-schema
