apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: journal-api
  namespace: journal
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - nana-journal.duckdns.org
      secretName: journal-tls
  rules:
    - host: nana-journal.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: journal-api
                port:
                  name: http
