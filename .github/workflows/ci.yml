name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a run on main (it may be mid-deploy).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: career_journal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: career_journal
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/career_journal
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/career_journal_test
      # Required by api.config.Settings so the app boots. Tests never call a
      # real LLM, so these placeholder values are never used for network requests.
      OPENAI_API_KEY: ci-placeholder-not-used-by-mock
      OPENAI_BASE_URL: https://example.invalid/v1
      OPENAI_MODEL: ci-placeholder-not-used-by-mock

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright type check
        run: uv run pyright

      - name: Initialize application and test databases
        run: |
          PGPASSWORD=postgres psql \
            -h localhost -U postgres -d career_journal \
            -v ON_ERROR_STOP=1 \
            -f database_setup.sql -f database_setup_test.sql

      - name: Run starter safeguards
        run: uv run pytest -m "not exercise" -v

  task:
    name: Task acceptance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: career_journal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: career_journal
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/career_journal
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/career_journal_test
      OPENAI_API_KEY: ci-placeholder-not-used-by-mock
      OPENAI_BASE_URL: https://example.invalid/v1
      OPENAI_MODEL: ci-placeholder-not-used-by-mock

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Initialize application and test databases
        run: |
          PGPASSWORD=postgres psql \
            -h localhost -U postgres -d career_journal \
            -v ON_ERROR_STOP=1 \
            -f database_setup.sql -f database_setup_test.sql

      - name: Run selected task and preceding exercises
        run: uv run python -m scripts.ci_tests --event "$GITHUB_EVENT_PATH"

  build:
    name: build
    needs: test
    # Only publish images for pushes to main, never for pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # lets this job request a short-lived OIDC token for AWS

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 011237053925.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: journal-api

    outputs:
      image: ${{ steps.publish.outputs.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::011237053925:role/github-actions-journal
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push commit-tagged image
        id: publish
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker build --build-arg GIT_SHA="${GITHUB_SHA}" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
